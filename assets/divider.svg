<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 24" width="1000" height="24">
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0EA5E9" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pulse">
      <stop offset="0" stop-color="#E0F7FF"/>
      <stop offset="0.35" stop-color="#00D4FF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="11" width="1000" height="2" fill="url(#line)"/>
  <ellipse cy="12" rx="70" ry="6" fill="url(#pulse)">
    <animate attributeName="cx" values="-80;1080" dur="3.5s" repeatCount="indefinite"/>
  </ellipse>
  <rect x="494" y="6" width="12" height="12" fill="#020617" stroke="#22D3EE" stroke-width="1.5" transform="rotate(45 500 12)"/>
</svg>
