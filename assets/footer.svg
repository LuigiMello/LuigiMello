<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#041530"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38BDF8" stroke-opacity="0.07"/>
    </pattern>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <filter id="dot" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="type"><rect x="300" y="110" height="40" width="0">
      <animate attributeName="width" values="0;400;400;0;0" keyTimes="0;0.3;0.8;0.9;1" dur="8s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>
  <rect width="1000" height="200" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="200" rx="18" fill="url(#grid)"/>
  <rect width="1000" height="200" rx="18" fill="url(#halo)"/>
  <g fill="none" stroke="#38BDF8" stroke-opacity="0.18"><path d="M60 50 L140 120 L80 170"/><path d="M940 40 L870 110 L950 160"/></g>
  <g fill="#38BDF8" filter="url(#dot)">
    <circle cx="60" cy="50" r="3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="120" r="3.5"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="170" r="2.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="40" r="3"><animate attributeName="opacity" values="1;0.4;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="870" cy="110" r="3.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="160" r="2.5"><animate attributeName="opacity" values="1;0.3;1" dur="3.8s" repeatCount="indefinite"/></circle>
  </g>
  <text x="500" y="88" text-anchor="middle" font-family="'Segoe UI Black','Arial Black','Segoe UI',Arial,sans-serif" font-weight="900" font-size="38" fill="none" stroke="#0EA5E9" stroke-width="1.2">THANKS FOR STOPPING BY</text>
  <text x="300" y="138" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#22D3EE" textLength="400" clip-path="url(#type)">// let's build something incredible</text>
  <rect y="122" width="10" height="20" fill="#22D3EE" x="300">
    <animate attributeName="x" values="304;706;706;304;304" keyTimes="0;0.3;0.8;0.9;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
