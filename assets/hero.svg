<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#041530"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="55%" r="42%">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38BDF8" stroke-opacity="0.07"/>
    </pattern>
    <linearGradient id="mello" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#A5E9FF"/>
      <stop offset="1" stop-color="#00D4FF"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;1 0" keyTimes="0;0.4;1" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#00D4FF" stop-opacity="0.10"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="12" result="b">
        <animate attributeName="stdDeviation" values="9;16;9" dur="4s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dot" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="r1"><rect x="372" y="370" height="40" width="0">
      <animate attributeName="width" values="0;330;330;0;0" keyTimes="0;0.1;0.25;0.3;1" dur="12s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="r2"><rect x="372" y="370" height="40" width="0">
      <animate attributeName="width" values="0;0;345;345;0;0" keyTimes="0;0.333;0.433;0.583;0.633;1" dur="12s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="r3"><rect x="372" y="370" height="40" width="0">
      <animate attributeName="width" values="0;0;300;300;0;0" keyTimes="0;0.667;0.767;0.917;0.967;1" dur="12s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <!-- background -->
  <rect width="1000" height="520" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="520" rx="18" fill="url(#grid)"/>
  <rect width="1000" height="520" rx="18" fill="url(#halo)"/>

  <!-- scan line -->
  <rect x="0" y="-90" width="1000" height="90" fill="url(#scan)">
    <animate attributeName="y" values="-90;520" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- network lines -->
  <g fill="none" stroke="#38BDF8" stroke-opacity="0.18" stroke-width="1">
    <path id="l1" d="M150 250 L75 330 L28 445"/>
    <path d="M150 250 L265 410"/>
    <path d="M70 80 L165 42"/>
    <path d="M860 120 L945 95 L905 185 Z"/>
    <path id="l2" d="M780 300 L870 355 L960 330 L945 445"/>
    <path d="M700 58 L860 120"/>
  </g>

  <!-- data pulses travelling along lines -->
  <circle r="3" fill="#7DD3FC" filter="url(#dot)">
    <animateMotion dur="5s" repeatCount="indefinite" path="M150 250 L75 330 L28 445"/>
  </circle>
  <circle r="3" fill="#7DD3FC" filter="url(#dot)">
    <animateMotion dur="6s" repeatCount="indefinite" path="M780 300 L870 355 L960 330 L945 445"/>
  </circle>

  <!-- particles -->
  <g fill="#38BDF8" filter="url(#dot)">
    <circle cx="70" cy="80" r="3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="165" cy="42" r="2"><animate attributeName="opacity" values="1;0.3;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="250" r="3.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="75" cy="330" r="3"><animate attributeName="opacity" values="1;0.4;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="28" cy="445" r="2.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="265" cy="410" r="3"><animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="22" r="2"><animate attributeName="opacity" values="1;0.2;1" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="58" r="2.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="120" r="3"><animate attributeName="opacity" values="1;0.4;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="945" cy="95" r="3.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="905" cy="185" r="2"><animate attributeName="opacity" values="1;0.3;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="300" r="3"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="870" cy="355" r="3.5"><animate attributeName="opacity" values="1;0.4;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="330" r="2.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="945" cy="445" r="3"><animate attributeName="opacity" values="1;0.3;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="495" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- HUD corners -->
  <g fill="none" stroke="#0EA5E9" stroke-opacity="0.55" stroke-width="2">
    <path d="M24 60 V24 H60"/>
    <path d="M940 24 H976 V60"/>
    <path d="M24 460 V496 H60"/>
    <path d="M940 496 H976 V460"/>
  </g>
  <text x="70" y="40" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#38BDF8" fill-opacity="0.5" letter-spacing="2">SYS.ONLINE // CWB-BR</text>
  <text x="930" y="488" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#38BDF8" fill-opacity="0.5" letter-spacing="2">v2026.10 // LUIGIMELLO</text>

  <!-- pill -->
  <rect x="405" y="44" width="190" height="36" rx="18" fill="#0EA5E9" fill-opacity="0.08" stroke="#0EA5E9" stroke-opacity="0.5"/>
  <circle cx="430" cy="62" r="4" fill="#22D3EE" filter="url(#dot)">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="446" y="67" font-family="Consolas, 'Courier New', monospace" font-size="14" fill="#67E8F9" letter-spacing="3" textLength="128">HELLO, I'M</text>

  <!-- Luigi (outline being drawn) -->
  <text x="500" y="205" text-anchor="middle" font-family="'Segoe UI Black','Arial Black','Segoe UI',Arial,sans-serif" font-weight="900" font-size="128" textLength="340" lengthAdjust="spacingAndGlyphs"
        fill="#0EA5E9" fill-opacity="0.06">Luigi</text>
  <text x="500" y="205" text-anchor="middle" font-family="'Segoe UI Black','Arial Black','Segoe UI',Arial,sans-serif" font-weight="900" font-size="128" textLength="340" lengthAdjust="spacingAndGlyphs"
        fill="none" stroke="#0EA5E9" stroke-width="2.2" stroke-dasharray="900">Luigi<animate attributeName="stroke-dashoffset" values="900;0" dur="3s" fill="freeze"/></text>

  <!-- Mello (glowing gradient + shine sweep) -->
  <g>
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.45;1" dur="2.2s" fill="freeze"/>
    <text x="500" y="340" text-anchor="middle" font-family="'Segoe UI Black','Arial Black','Segoe UI',Arial,sans-serif" font-weight="900" font-size="150" textLength="450" lengthAdjust="spacingAndGlyphs"
          fill="url(#mello)" filter="url(#glow)">Mello</text>
    <text x="500" y="340" text-anchor="middle" font-family="'Segoe UI Black','Arial Black','Segoe UI',Arial,sans-serif" font-weight="900" font-size="150" textLength="450" lengthAdjust="spacingAndGlyphs"
          fill="url(#shine)">Mello</text>
  </g>

  <!-- role typing -->
  <text x="322" y="398" font-family="Consolas, 'Courier New', monospace" font-size="26" fill="#0EA5E9" fill-opacity="0.7" textLength="36">//</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="26" fill="#22D3EE">
    <text x="372" y="398" textLength="312" clip-path="url(#r1)">Full-Stack Developer</text>
    <text x="372" y="398" textLength="328" clip-path="url(#r2)">AI Solutions Engineer</text>
    <text x="372" y="398" textLength="296" clip-path="url(#r3)">Frontend Specialist</text>
  </g>
  <rect y="376" width="14" height="28" fill="#22D3EE" x="372">
    <animate attributeName="x" values="378;690;690;378;378;706;706;378;378;674;674;378;378" keyTimes="0;0.1;0.25;0.3;0.333;0.433;0.583;0.633;0.667;0.767;0.917;0.967;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- subtitle -->
  <text x="500" y="448" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#8BA3C7">Passionate about technology &amp; software development.</text>
  <text x="500" y="476" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#8BA3C7">I turn ideas into incredible digital experiences.</text>
</svg>
